
services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb           
    container_name: mariadb
    restart: always
    env_file: .env
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${SQL_ROOT_PWD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  redis:
    build: ./requirements/redis
    image: redis
    container_name: redis
    restart: always
    networks:
      - inception
    command: ["--requirepass", "${REDIS_PWD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PWD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  wordpress:
    build: ./requirements/wordpress
    image: wordpress        
    container_name: wordpress
    restart: always
    env_file: .env
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - wp-data:/var/www/html
    networks:
      - inception

  adminer:
    build: ./requirements/adminer
    image: adminer
    container_name: adminer
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - inception
  nginx:
    build: ./requirements/nginx
    image: nginx            
    container_name: nginx
    restart: always
    ports:
      - "443:443"            
    depends_on:
      - wordpress

    volumes:
      - wp-data:/var/www/html
    networks:
      - inception
  ftp:
    build: ./requirements/ftp
    image: ftp
    container_name: ftp
    restart: always
    ports:
      - "21:21"
      - "50000-50100:50000-50100"
    volumes:
      - wp-data:/var/www/html
    env_file: .env
  website:
    build: ./requirements/website
    image: website
    container_name: website
    restart: always
    networks:
      - inception
  portainer:
    build: ./requirements/portainer
    image: portainer
    container_name: portainer
    restart: always
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - inception  
networks:
  inception:

volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/oben-jha/data/mariadb  
  wp-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/oben-jha/data/wordpress
  portainer-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/oben-jha/data/portainer